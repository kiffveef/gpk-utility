name: Build Windows

on:
  push:
    branches: [main, fix/**]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run check

      - name: Build
        run: |
          Remove-Item -Path dist, dist-electron -Recurse -Force -ErrorAction SilentlyContinue
          npx vite build
          New-Item -ItemType Directory -Force -Path dist-electron
          Copy-Item -Path dist/* -Destination dist-electron/ -Recurse
          npx electron-builder -w
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
